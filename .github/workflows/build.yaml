name: build

on:
  push:
  schedule:
    - cron: 0 12 1 * *

jobs:
  test-latest:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Setup just
      uses: ./
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Test
      run: |
        [ "$(just --justfile tests/Justfile)" = "Test..." ]
      shell: bash

  test-version:
    needs: test-latest
    strategy:
      matrix:  # https://github.com/casey/just/releases
        just-version: [0.5.11, 0.6.1, 0.7.3, 0.8.7, 0.9.9, 0.10.7, 0.11.2, 1.5.0, 1.23.0, 1.40.0]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Run self
      uses: ./
      with:
        just-version: ${{ matrix.just-version }}
    - name: Check version
      run: just --version | grep -E "^just v?${{ matrix.just-version }}$"
    - name: Test
      run: |
        [ "$(just --justfile tests/Justfile)" = "Test..." ]

  test-version-file:
    needs: test-latest
    strategy:
      matrix:
        include:
          - file: .tool-versions
            content: just 1.40.0
            version: 1.40.0
          - file: .just-version
            content: 1.39.0
            version: 1.39.0
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Create ${{ matrix.file }}
      run: echo "${{ matrix.content }}" > "${{ matrix.file }}"
    - name: Run self
      uses: ./
      with:
        just-version-file: ${{ matrix.file }}
    - name: Check version
      run: just --version | grep -E "^just v?${{ matrix.version }}$"
    - name: Test
      run: |
        [ "$(just --justfile tests/Justfile)" = "Test..." ]
